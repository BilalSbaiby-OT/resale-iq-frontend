# Deploy to production on a green build.
#
# Why this exists: pushing to main did NOT deploy. Coolify talks to GitHub
# through a GitHub App, and Coolify builds that App's webhook URL from its own
# instance URL — which is empty (Settings > General > URL is blank, and
# `docker exec coolify printenv APP_URL` returns nothing). So GitHub had
# nowhere to deliver push events. The SEO release on 2026-08-29 sat unshipped
# for 20+ minutes before someone clicked Redeploy by hand.
#
# Fixing that properly needs a public HTTPS name for Coolify, which needs DNS
# the agents cannot change. This is the route that works today: Coolify's API
# is only reachable on localhost (a Hetzner Cloud Firewall blocks 8000 from the
# internet; the host itself is wide open), and port 22 is allowed — so SSH is
# the door.
#
# SECURITY. The key in COOLIFY_DEPLOY_KEY is useless for anything but this.
# It is registered in the server's authorized_keys behind a forced command:
#
#   command="curl ... /api/v1/deploy?uuid=<this app>",no-pty,no-port-forwarding,...
#
# sshd runs that command and ignores whatever the client asks for, which is why
# the ssh call below sends no command at all. A leaked key can redeploy this one
# application and nothing else — no shell, no file access, no other app. The
# Coolify API token lives in that forced command on the server and is never
# stored in GitHub.
#
# Setup lives in /root/setup-ci-deploy.sh on the server (idempotent).
name: Deploy

# "on" is quoted deliberately: bare `on` is a YAML 1.1 boolean, so a strict
# parser reads this key as `true`. GitHub tolerates it, every local linter does
# not. Same reason as backend-tests.yml in the demand-intel repo.
"on":
  # Only after CI is green. Deploying on raw `push` would ship a build that
  # never typechecked — the isolation workflow is the gate that makes the
  # customer/agent firewall meaningful, so it has to pass first.
  workflow_run:
    workflows: ["Agent Isolation"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# A newer commit should win. Deploys are not queued: cancel an in-flight one
# rather than racing two builds onto the same container.
concurrency:
  group: deploy-production
  # CANCEL superseded deploys. This was `false`, which serialised them: five
  # pushes became five sequential Coolify rebuilds, each with its own window
  # where the site serves nothing.
  #
  # That is not just CI noise. On 2026-09-01 an agent capturing product footage
  # from production hit "Could not check that item right now" on a query that
  # works perfectly -- it was simply asking during one of those windows. Real
  # visitors get the same page, and we are driving traffic now.
  #
  # Cancelling is correct for a deploy specifically: you never need to ship
  # commit N-2 once N is already queued, because main is the deployable unit
  # and the newest commit contains the older ones. It collapses N rebuilds into
  # one. `false` is right for migrations or anything where each run has its own
  # side effect; this run has exactly one, and it is idempotent.
  cancel-in-progress: true

jobs:
  deploy:
    # workflow_dispatch has no workflow_run context, hence the first clause.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # Generous: the wait step polls for up to 15 minutes while Coolify
    # builds the image and swaps the container. A 5-minute cap would kill
    # the job mid-check and report a failure for a deploy that succeeded.
    timeout-minutes: 25

    steps:
      # scripts/check-deploy-identity.sh (below) is a repo file — without this
      # the job has no working tree and the identity check fails every run
      # with "No such file or directory", regardless of whether the deploy
      # itself succeeded. Found 2026-09-03: run 33774559333 reported failure
      # on a deploy that had, in fact, shipped (confirmed live on /deploy-id).
      - uses: actions/checkout@v4

      # Fingerprint the CURRENTLY served build first. Next.js names its chunks
      # by content hash, so this string changes whenever the bundle changes —
      # which is what lets the check below prove a NEW build is live rather
      # than merely that the site is up.
      - name: Fingerprint the running build
        id: before
        run: |
          set -uo pipefail
          # RETRY, because this step races the very thing it measures. It curls
          # the LIVE site, and a push during a Coolify rebuild gets a page with
          # no chunks in it -- grep then exits 1 and `set -e` kills the job.
          # That is exactly how two Deploy runs failed on 2026-09-01, sixty
          # seconds apart, from two pushes in the same minute. Nothing was
          # broken; the check was simply asking during the window it exists to
          # measure across.
          fp=""
          for attempt in 1 2 3 4 5 6; do
            fp=$(curl -sL -m 20 https://resaleiq.dev/ \
                 | grep -oE '_next/static/chunks/[A-Za-z0-9._-]+\.js' \
                 | sort -u | sha256sum | cut -d' ' -f1) || true
            # sha256sum of empty input is a fixed, known string. Treat it as
            # "nothing served yet" rather than as a fingerprint, otherwise the
            # after-check compares one empty page against another and passes.
            if [ -n "${fp}" ] && [ "${fp}" != "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855" ]; then
              echo "Serving build fingerprint ${fp} (attempt ${attempt})"
              break
            fi
            echo "No chunks served yet (attempt ${attempt}/6) — site is probably mid-rebuild; retrying in 10s"
            fp=""
            sleep 10
          done
          if [ -z "${fp}" ]; then
            echo "::error::resaleiq.dev served no build chunks after 6 attempts over ~60s. \
          That is a real outage, not a rebuild window — investigate before deploying over it."
            exit 1
          fi
          echo "fingerprint=${fp}" >> "$GITHUB_OUTPUT"

      - name: Trigger Coolify deploy over SSH
        env:
          DEPLOY_KEY: ${{ secrets.COOLIFY_DEPLOY_KEY }}
          DEPLOY_HOST: 62.238.51.83
        run: |
          set -euo pipefail

          if [ -z "${DEPLOY_KEY}" ]; then
            echo "::error::COOLIFY_DEPLOY_KEY is not set on this repository."
            exit 1
          fi

          install -m 700 -d ~/.ssh
          printf '%s\n' "${DEPLOY_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # Pin the host key rather than disabling the check. If the server is
          # ever rebuilt this fails loudly instead of trusting a new host.
          ssh-keyscan -t ed25519 "${DEPLOY_HOST}" >> ~/.ssh/known_hosts 2>/dev/null

          # No command argument on purpose — authorized_keys carries a forced
          # command (POST to Coolify's deploy API) that sshd runs regardless of
          # what the client asks for. curl -f inside it turns an HTTP error into
          # a non-zero exit here, so a refused deploy fails this job.
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -i ~/.ssh/id_ed25519 "root@${DEPLOY_HOST}"

          echo "Deploy queued in Coolify."

      - name: Resolve expected commit
        id: expected
        run: |
          # workflow_run carries the SHA of the commit that produced the green
          # "Agent Isolation" run, NOT github.sha (which on a workflow_run
          # event is this workflow file's own ref). workflow_dispatch has no
          # workflow_run context, so it falls back to github.sha.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            sha="${{ github.sha }}"
          else
            sha="${{ github.event.workflow_run.head_sha }}"
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "Expecting commit ${sha} to be live."

      - name: Wait for the NEW build to serve
        run: |
          set -uo pipefail
          BEFORE="${{ steps.before.outputs.fingerprint }}"
          EXPECTED="${{ steps.expected.outputs.sha }}"
          # The chunk-hash fingerprint only proves SOMETHING new shipped — it
          # is structurally blind to server-only changes (middleware,
          # rewrites, route handlers, env vars), since those never move a
          # client chunk hash. Run 33746779363 hit exactly this: a
          # next.config.ts rewrite change reported "Bundle unchanged after 15
          # min" and exited success, on a deploy that had in fact shipped.
          #
          # The actual gate is scripts/check-deploy-identity.sh, which asserts
          # /deploy-id's SOURCE_COMMIT (Coolify-stamped, confirmed live to
          # match the container that's actually running) against the commit
          # THIS run means to ship. scripts/test-check-deploy-identity.sh
          # falsifies that script against fixtures — see it for proof this
          # can fail red, not just pass green.
          # Poll every 5s for the first 2 minutes (the app's measured baseline
          # deploy is ~1m25s, so the overwhelming majority of runs exit here),
          # then back off to 15s. The old loop slept 15s before its FIRST
          # check, so even an already-finished deploy billed a minimum of 15s
          # and a typical one billed ~90s of pure sleep. Same 15-minute
          # ceiling, far fewer billed idle minutes on the common path.
          deadline=$(( $(date +%s) + 900 ))
          i=0
          while [ "$(date +%s)" -lt "${deadline}" ]; do
            i=$((i+1))
            if [ "${i}" -le 24 ]; then sleep 5; else sleep 15; fi
            now=$(curl -sL -m 20 https://resaleiq.dev/ \
                  | grep -oE '_next/static/chunks/[A-Za-z0-9._-]+\.js' \
                  | sort -u | sha256sum | cut -d' ' -f1) || true
            if scripts/check-deploy-identity.sh "${EXPECTED}" 2>/tmp/identity.log; then
              cat /tmp/identity.log
              echo "Confirmed after ~$(( $(date +%s) - (deadline - 900) ))s."
              [ -n "${now}" ] && [ "${now}" != "${BEFORE}" ] && echo "Client bundle also changed (fingerprint ${now})." \
                || echo "Client bundle fingerprint unchanged — expected for a server-only change, now proven safe by commit identity instead."
              code=$(curl -s -o /dev/null -w '%{http_code}' -m 20 https://resaleiq.dev/flip || true)
              [ "$code" = "200" ] || echo "::warning::New build is live but /flip returned ${code}."
              exit 0
            fi
            echo "Not yet (attempt ${i}): $(cat /tmp/identity.log)"
          done
          # A real failure, not a warning: 15 minutes is well past this app's
          # normal deploy time (~1m25s baseline), and unlike the old bundle
          # check, "the wrong commit is being served" is never the expected
          # outcome of a successful run.
          echo "::error::resaleiq.dev is still not serving ${EXPECTED} after 15 min. Either the deploy failed, or /deploy-id is misreporting — check Coolify's deployment log before assuming success."
          exit 1
