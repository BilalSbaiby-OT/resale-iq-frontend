# Customer / agent firewall — CI enforcement.
#
# Company spec §54 requires the customer/agent isolation tests to run in
# CI/CD. The backend repo holds the matching Python suite, but its frontend
# assertions skip when this repo isn't checked out — which is always, in
# backend CI. So this is the half that actually guards the browser bundle.
#
# It builds first on purpose. Source-only scanning misses the real failure
# mode: a secret inlined at build time (NEXT_PUBLIC_*, or baked into a
# prerendered page). The bundle is what the customer receives, so the bundle
# is what gets checked.
name: Agent Isolation

on:
  push:
    branches: [main]
    # Scope to code that affects the bundle/behaviour. This is ALSO the deploy
    # gate (deploy.yml waits on this workflow's success), so a docs-only push
    # correctly skips both the firewall run and the deploy — nothing shippable
    # changed. Keep this list in step with playwright.yml's code_paths.
    paths: &code_paths
      - "src/**"
      - "e2e/**"
      - "public/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "tsconfig.json"
      - ".nvmrc"
      - ".github/workflows/agent-isolation.yml"
  pull_request:
    branches: [main]
    paths: *code_paths

jobs:
  firewall:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24 to match .nvmrc and local dev. The TS unit tests
          # (node --test src/lib/*.test.ts) need >=22.6 for type-stripping AND
          # glob support; on Node 20 they failed with "Could not find
          # src/lib/*.test.ts", which failed this whole workflow and — because
          # Deploy waits on its success — silently blocked every auto-deploy.
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Fast fail: catches a committed secret before spending a build on it.
      - name: Check source
        run: npm run check:isolation

      - name: Typecheck
        run: npx tsc --noEmit

      # `npm run test:unit` existed but nothing ran it — not this workflow, not
      # playwright.yml. A test no pipeline executes is a comment, and every
      # guarantee here is a claim a customer reads off the screen: a real
      # sell-through rate printing as "0%", a momentum chip asserting a
      # direction the percentile method cannot compute, and trial copy drifting
      # back to "unlimited" or back into hardcoded English.
      - name: Unit tests
        run: npm run test:unit

      - name: Warehouse honesty
        # A check blocks the DEPLOY only if what it catches could reach a
        # customer. Duplicate logic and swallowed errors can. A stale document
        # cannot.
        #
        # check:inventory blocked 14 commits -- including a language switcher a
        # visitor needs -- because I added MISSION.md and forgot to regenerate a
        # markdown file. That is the same disproportion as the stop-gate that
        # demanded a clean tree while the guard's own logger dirtied it, and as
        # the isolation check that froze the frontend for 9 commits over a
        # credential NAME in a dashboard payload.
        #
        # The docs checks still RUN and still print loudly. They just do not
        # stand between a fix and production.
        run: npm run check:tracked && npm run check:warehouse && npm run check:market-proof && npm run check:dupes && npm run check:silent && npm run check:locale-english

      - name: Docs freshness (advisory — never blocks a deploy)
        continue-on-error: true
        run: npm run check:gates && npm run check:inventory

      - name: Build
        run: npm run build
        env:
          # No agent credential is provided here, deliberately. If a build ever
          # needs one, the firewall has already been breached by design and this
          # job should fail rather than be "fixed" by adding the secret.
          #
          # The names are not spelled out even in this comment: the checker
          # treats any mention of them in this repo as a violation, and that
          # strictness is worth more than a more explicit comment. It is what
          # stops a real secret being parked in a workflow env block.
          BACKEND_URL: http://localhost:8080

      - name: Check build output
        run: npm run check:isolation:built
