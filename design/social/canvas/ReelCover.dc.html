     drawn — nothing here should show a guide line in the exported frame. -->

  <div style="display: flex; align-items: center; gap: 18px;">

    <div style="font-size: 32px; font-weight: 700; color: #e8ecf4; letter-spacing: -0.3px;">Resale IQ</div>
  </div>

  <!-- hook — the 0s frame, placeholder pending strategy + humanizer pass -->

    <div style="font-size: 92px; font-weight: 800; line-height: 1.15; letter-spacing: -1.8px; color: #e8ecf4; text-wrap: pretty;">
      [Hook — spoken line 1, on screen at 0s. ≤ 12 words.]
