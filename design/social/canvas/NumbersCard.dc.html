<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap">
  <style>
    body { margin: 0; background: transparent; }
    a { color: #8fa3c4; } a:hover { color: #c3cde0; }
    .riq-nc-value { font-family: "JetBrains Mono", ui-monospace, "SF Mono", monospace; }
    .riq-nc-sans { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</helmet>

<div style="width: 100%; box-sizing: border-box; background: #12151d; border: 1px solid #1c2333; border-left: 10px solid {{accentColor}}; border-radius: 28px; padding: 56px 60px; display: flex; flex-direction: column; gap: 0;">

  <!-- brand row -->
  <div style="display: flex; align-items: center; gap: 16px; margin-bottom: 36px;">
    <div style="width: 40px; height: 40px; border-radius: 11px; background: linear-gradient(135deg,#22c55e,#0ea5e9); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 20px; color: #06090c;" class="riq-nc-sans">R</div>
    <div class="riq-nc-sans" style="font-size: 28px; font-weight: 700; color: #e8ecf4; letter-spacing: -0.2px;">Resale IQ</div>
    <sc-if value="{{hasTitle}}" hint-placeholder-val="{{true}}">
      <div class="riq-nc-sans" style="margin-left: auto; font-size: 28px; font-weight: 600; color: #8fa3c4;">{{title}}</div>
    </sc-if>
  </div>

  <!-- stat row: 1-3 stats -->
  <div style="display: flex; gap: 56px; flex-wrap: wrap; align-items: flex-end; padding-bottom: 40px; border-bottom: 1px solid #1e2535;">
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div class="riq-nc-value" style="font-size: 128px; font-weight: 800; letter-spacing: -3px; line-height: 1; color: {{stat1Color}};">{{stat1Value}}</div>
      <div class="riq-nc-sans" style="font-size: 36px; font-weight: 600; color: #8fa3c4;">{{stat1Label}}</div>
    </div>
    <sc-if value="{{hasStat2}}" hint-placeholder-val="{{true}}">
      <div style="display: flex; flex-direction: column; gap: 10px;">
        <div class="riq-nc-value" style="font-size: 96px; font-weight: 800; letter-spacing: -2px; line-height: 1; color: #e8ecf4;">{{stat2Value}}</div>
        <div class="riq-nc-sans" style="font-size: 32px; font-weight: 600; color: #8fa3c4;">{{stat2Label}}</div>
      </div>
    </sc-if>
    <sc-if value="{{hasStat3}}" hint-placeholder-val="{{false}}">
      <div style="display: flex; flex-direction: column; gap: 10px;">
        <div class="riq-nc-value" style="font-size: 96px; font-weight: 800; letter-spacing: -2px; line-height: 1; color: #e8ecf4;">{{stat3Value}}</div>
        <div class="riq-nc-sans" style="font-size: 32px; font-weight: 600; color: #8fa3c4;">{{stat3Label}}</div>
      </div>
    </sc-if>
  </div>

  <!-- provenance row: the part that never gets dropped -->
  <div style="display: flex; gap: 48px; margin-top: 40px; flex-wrap: wrap;">
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <div class="riq-nc-value" style="font-size: 44px; font-weight: 800; color: {{honestyColor}};">n={{nValue}}</div>
      <div class="riq-nc-sans" style="font-size: 28px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: #7f8da9;">sample size</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <div class="riq-nc-value" style="font-size: 44px; font-weight: 800; color: #e8ecf4;">{{period}}</div>
      <div class="riq-nc-sans" style="font-size: 28px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: #7f8da9;">period</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <div class="riq-nc-value" style="font-size: 44px; font-weight: 800; color: #e8ecf4;">{{market}}</div>
      <div class="riq-nc-sans" style="font-size: 28px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: #7f8da9;">market</div>
    </div>
  </div>

  <sc-if value="{{hasFootnote}}" hint-placeholder-val="{{false}}">
    <div class="riq-nc-sans" style="margin-top: 32px; padding-top: 28px; border-top: 1px solid #1e2535; font-size: 28px; line-height: 1.5; color: #a9b6d0;">{{footnote}}</div>
  </sc-if>

</div>
</x-dc>
<script data-dc-script data-props='{
  "accent": {"editor": "enum", "options": ["buy", "watch", "skip", "honesty", "neutral"], "default": "buy", "section": "Style"},
  "title": {"editor": null, "default": "New Balance 530"},
  "stat1Value": {"editor": null, "default": "542"},
  "stat1Label": {"editor": null, "default": "sold"},
  "stat2Value": {"editor": null, "default": "€40"},
  "stat2Label": {"editor": null, "default": "median"},
  "stat3Value": {"editor": null, "default": "€26.88"},
  "stat3Label": {"editor": null, "default": "ceiling"},
  "nValue": {"editor": null, "default": "174"},
  "period": {"editor": null, "default": "7d"},
  "market": {"editor": null, "default": "EU5"},
  "footnote": {"editor": null, "default": ""},
  "$preview": {"width": 900, "height": 620}
}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const accentMap = {
      buy: "#22c55e",
      watch: "#fbbf24",
      skip: "#f87171",
      honesty: "#c4a574",
      neutral: "#5b6b8c"
    };
    const accent = p.accent ?? "buy";
    const accentColor = accentMap[accent] ?? accentMap.buy;
    return {
      accentColor: accentColor,
      stat1Color: accentColor,
      honestyColor: "#c4a574",
      hasTitle: !!(p.title && p.title.length),
      title: p.title ?? "",
      stat1Value: p.stat1Value ?? "542",
      stat1Label: p.stat1Label ?? "sold",
      hasStat2: !!(p.stat2Value && p.stat2Value.length),
      stat2Value: p.stat2Value ?? "",
      stat2Label: p.stat2Label ?? "",
      hasStat3: !!(p.stat3Value && p.stat3Value.length),
      stat3Value: p.stat3Value ?? "",
      stat3Label: p.stat3Label ?? "",
      nValue: p.nValue ?? "174",
      period: p.period ?? "7d",
      market: p.market ?? "EU5",
      hasFootnote: !!(p.footnote && p.footnote.length),
      footnote: p.footnote ?? ""
    };
  }
}
</script>
</body>
</html>
