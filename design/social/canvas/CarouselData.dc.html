<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap">
  <style>
    html, body { margin: 0; padding: 0; }
    body { width: 1080px; height: 1350px; background: #0B0D10; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</helmet>

<div style="width: 1080px; height: 1350px; box-sizing: border-box; background: #0B0D10; display: flex; flex-direction: column; padding: 90px 90px 96px;">

  <!-- brand mark -->
  <div style="display: flex; align-items: center; gap: 18px; margin-bottom: 56px;">
    <div style="width: 52px; height: 52px; border-radius: 14px; background: linear-gradient(135deg,#22c55e,#0ea5e9); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 26px; color: #06090c;">R</div>
    <div style="font-size: 32px; font-weight: 700; color: #e8ecf4; letter-spacing: -0.3px;">Resale IQ</div>
    <div style="margin-left: auto; font-size: 28px; font-weight: 600; color: #7f8da9;">7d, EU5 · snapshot 14</div>
  </div>

  <!-- worked example: New Balance 530, post 1's own numbers, verbatim -->
  <div style="flex: 1; display: flex; align-items: center;">
    <dc-import name="NumbersCard"
      title="New Balance 530"
      accent="buy"
      stat1-value="542" stat1-label="sold"
      stat2-value="€40" stat2-label="median"
      stat3-value="€26.88" stat3-label="ceiling"
      n-value="174" period="7d" market="EU5"
      footnote=""
      hint-size="900,620">
    </dc-import>
  </div>

  <!-- honesty line every data slide carries -->
  <div style="font-size: 30px; color: #8fa3c4; font-weight: 600; line-height: 1.5;">
    Watched, not estimated — 174 comparable sales, ES/FR/DE/IT/PT, 2026-08-24→08-31.
  </div>

</div>
</x-dc>
</body>
</html>
