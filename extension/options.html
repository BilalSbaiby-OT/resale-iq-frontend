<!doctype html>
<meta charset="utf-8">
<title>Resale IQ</title>
<style>
  body { font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         background: #0B0D10; color: #eef1f7; padding: 28px; max-width: 460px; }
  h1 { font-size: 18px; margin: 0 0 6px; }
  p { color: #8b99b8; font-size: 13px; }
  input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #232c42;
          background: #12151d; color: #eef1f7; font-size: 13px; box-sizing: border-box; }
  button { margin-top: 10px; background: #22c55e; color: #06090c; font-weight: 700;
           border: 0; border-radius: 8px; padding: 10px 18px; font-size: 13px; cursor: pointer; }
  .ok { color: #34d399; font-size: 12px; margin-top: 8px; min-height: 16px; }
  a { color: #22c55e; }
</style>
<h1>Resale IQ</h1>
<p>Works without an account — you get the free daily checks. Paste a token to
   use your plan's allowance instead. Get one from
   <a href="https://resaleiq.dev/account" target="_blank">your account page</a>.</p>
<input id="tok" type="password" placeholder="Paste token (optional)" autocomplete="off">
<button id="save">Save</button>
<div class="ok" id="msg"></div>
<script src="options.js"></script>
